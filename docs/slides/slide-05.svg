    </g>
    <g>
      <rect x="945" y="530" width="245" height="150" rx="20" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2.5"/>
      <path d="M1030 556 Q1067 542 1104 556 L1104 606 Q1067 620 1030 606 Z" fill="#FFE9E6" stroke="#3D3A37" stroke-width="2.5"/>
      <text x="1067" y="596" text-anchor="middle" font-size="26" font-weight="800" fill="#BB3A2C">?</text>
      <text x="1067" y="664" text-anchor="middle" font-size="19" fill="#A39A90">текстовые задачи</text>
    </g>
