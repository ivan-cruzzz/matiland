    <path d="M78 82 L74 42 L94 60 L110 36 L126 60 L146 42 L142 82 Z" fill="#FFD45E" stroke="#3D3A37" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="88" cy="38" rx="15" ry="40" fill="#A8E6CF" stroke="#3D3A37" stroke-width="3"/>
    <ellipse cx="132" cy="38" rx="15" ry="40" fill="#A8E6CF" stroke="#3D3A37" stroke-width="3"/>
    <rect x="62" y="76" width="96" height="118" rx="46" fill="#A8E6CF" stroke="#3D3A37" stroke-width="3"/>
