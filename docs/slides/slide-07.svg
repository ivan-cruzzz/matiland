<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="720" fill="#FDF8F2"/>
  <text x="90" y="100" font-size="56" font-weight="800" fill="#3D3A37">Свой герой и его комната</text>
  <text x="90" y="148" font-size="26" fill="#6F6862">Ребёнок создаёт персонажа при регистрации и растит его</text>

  <g transform="translate(120,180) scale(1.55)">
