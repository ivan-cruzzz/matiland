    <ellipse cx="88" cy="194" rx="13" ry="8" fill="#7ED4B4" stroke="#3D3A37" stroke-width="3"/>
    <ellipse cx="132" cy="194" rx="13" ry="8" fill="#7ED4B4" stroke="#3D3A37" stroke-width="3"/>
    <g transform="translate(158,150) scale(0.42)">
      <circle cx="182" cy="186" r="15" fill="#FFE38A" stroke="#3D3A37" stroke-width="2.5"/>
      <path d="M196 184 L205 187 L196 190 Z" fill="#FF948A" stroke="#3D3A37" stroke-width="2"/>
      <circle cx="187" cy="182" r="2" fill="#3D3A37"/>
    </g>
  </g>

  <g font-size="22" font-weight="700" fill="#3D3A37">
    <rect x="560" y="180" width="290" height="54" rx="27" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2"/>
    <text x="580" y="215">5 героев и 8 цветов</text>
    <rect x="560" y="248" width="290" height="54" rx="27" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2"/>
    <text x="580" y="283">эмоции: радость и грусть</text>
    <rect x="560" y="316" width="290" height="54" rx="27" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2"/>
    <text x="580" y="351">крылья с 5 уровня, нимб с 8-го</text>
    <rect x="560" y="384" width="290" height="54" rx="27" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2"/>
    <text x="580" y="419">свой питомец из конструктора</text>
    <rect x="560" y="452" width="290" height="54" rx="27" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2"/>
    <text x="580" y="487">друг-компаньон рядом</text>
    <rect x="560" y="520" width="290" height="54" rx="27" fill="#FFFFFF" stroke="#EFE6DA" stroke-width="2"/>
    <text x="580" y="555">золотой и радужный окрасы</text>
  </g>

  <g transform="translate(900,200)">
    <rect x="0" y="0" width="300" height="170" rx="14" fill="#F0EAFC"/>
    <circle cx="60" cy="50" r="6" fill="#C9B8F0" opacity="0.7"/>
