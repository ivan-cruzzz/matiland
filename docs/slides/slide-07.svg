    <circle cx="240" cy="55" r="6" fill="#C9B8F0" opacity="0.7"/>
    <circle cx="105" cy="80" r="6" fill="#C9B8F0" opacity="0.7"/>
    <circle cx="200" cy="85" r="6" fill="#C9B8F0" opacity="0.7"/>
    <rect x="0" y="128" width="300" height="42" rx="10" fill="#FFD3B6"/>
    <line x1="0" y1="130" x2="300" y2="130" stroke="#3D3A37" stroke-width="2"/>
    <rect x="20" y="18" width="80" height="60" rx="6" fill="#FFFFFF" stroke="#3D3A37" stroke-width="2.5"/>
