    <ellipse cx="215" cy="120" rx="18" ry="12" fill="#FFBA8F" stroke="#3D3A37" stroke-width="2.5"/>
    <circle cx="212" cy="114" r="2" fill="#3D3A37"/>
    <text x="150" y="200" text-anchor="middle" font-size="24" font-weight="800" fill="#3D3A37">Комната: обои, пол, постер,</text>
    <text x="150" y="232" text-anchor="middle" font-size="24" font-weight="800" fill="#3D3A37">игрушки и светильники</text>
  </g>
</svg>
