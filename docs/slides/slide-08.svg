    <text x="995" y="392" text-anchor="middle" font-size="26" font-weight="800" fill="#3D3A37">Математическое лото 3×3</text>
  </g>

  <g>
    <rect x="90" y="440" width="530" height="220" rx="24" fill="#FFF6D9" stroke="#FFE38A" stroke-width="3"/>
    <path d="M330 480 L342 508 L372 512 L350 533 L356 562 L330 548 L304 562 L310 533 L288 512 L318 508 Z" fill="#FFD45E" stroke="#8A620A" stroke-width="3" stroke-linejoin="round"/>
