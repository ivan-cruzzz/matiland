<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="720" fill="#FDF8F2"/>
  <text x="90" y="100" font-size="56" font-weight="800" fill="#3D3A37">Больше, чем раунды</text>

  <g>
    <rect x="90" y="160" width="330" height="240" rx="24" fill="#E9F5FC" stroke="#A6D8F0" stroke-width="3"/>
