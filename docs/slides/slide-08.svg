    <text x="255" y="250" text-anchor="middle" font-size="26" font-weight="800" fill="#1D6FA3">7</text>
    <ellipse cx="180" cy="290" rx="46" ry="24" fill="#FFFFFF" stroke="#3D3A37" stroke-width="3"/>
    <text x="180" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#1D6FA3">12</text>
    <ellipse cx="320" cy="300" rx="46" ry="24" fill="#FFFFFF" stroke="#3D3A37" stroke-width="3"/>
    <text x="320" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#1D6FA3">9</text>
    <text x="255" y="356" text-anchor="middle" font-size="28" font-weight="800" fill="#3D3A37">Ловим ответы</text>
    <text x="255" y="384" text-anchor="middle" font-size="20" fill="#6F6862">кликай облачка с верным ответом</text>
