    <text x="440" y="520" font-size="28" font-weight="800" fill="#3D3A37">Олимпиада</text>
    <text x="440" y="556" font-size="21" fill="#6F6862">5 этапов растущей сложности,</text>
    <text x="440" y="584" font-size="21" fill="#6F6862">кубок + большой сундук чемпиону</text>
  </g>
  <g>
    <rect x="650" y="440" width="540" height="220" rx="24" fill="#FFE9E6" stroke="#FFB3AB" stroke-width="3"/>
    <circle cx="730" cy="530" r="34" fill="#FFFFFF" stroke="#3D3A37" stroke-width="3"/>
    <text x="730" y="540" text-anchor="middle" font-size="26" font-weight="800" fill="#BB3A2C">P1</text>
    <circle cx="810" cy="530" r="34" fill="#FFFFFF" stroke="#3D3A37" stroke-width="3"/>
    <text x="810" y="540" text-anchor="middle" font-size="26" font-weight="800" fill="#6D4FC2">P2</text>
    <path d="M770 585 Q770 605 800 605 Q830 605 830 585" fill="none" stroke="#3D3A37" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/>
    <text x="890" y="520" font-size="28" font-weight="800" fill="#3D3A37">Дуэль</text>
    <text x="890" y="556" font-size="21" fill="#6F6862">двое на одном устройстве:</text>
    <text x="890" y="584" font-size="21" fill="#6F6862">по очереди, победителю монеты</text>
