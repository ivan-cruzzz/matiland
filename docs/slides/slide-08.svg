    <rect x="600" y="205" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#3D3A37" stroke-width="2.5"/>
    <text x="631" y="246" text-anchor="middle" font-size="22" font-weight="800" fill="#8A620A">24</text>
    <rect x="560" y="285" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#3D3A37" stroke-width="2.5"/>
    <text x="591" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#8A620A">?</text>
    <rect x="640" y="285" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#3D3A37" stroke-width="2.5"/>
    <text x="671" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#8A620A">?</text>
    <text x="615" y="384" text-anchor="middle" font-size="28" font-weight="800" fill="#3D3A37">Парочки</text>
  </g>
  <g>
    <rect x="810" y="160" width="380" height="240" rx="24" fill="#E3F7EE" stroke="#A8E6CF" stroke-width="3"/>
    <g stroke="#3D3A37" stroke-width="2.5">
      <rect x="890" y="200" width="46" height="46" rx="8" fill="#FFFFFF"/>
      <rect x="946" y="200" width="46" height="46" rx="8" fill="#E3F7EE"/>
      <rect x="1002" y="200" width="46" height="46" rx="8" fill="#FFFFFF"/>
      <rect x="890" y="256" width="46" height="46" rx="8" fill="#E3F7EE"/>
      <rect x="946" y="256" width="46" height="46" rx="8" fill="#7ED4B4"/>
      <rect x="1002" y="256" width="46" height="46" rx="8" fill="#FFFFFF"/>
      <rect x="890" y="312" width="46" height="46" rx="8" fill="#FFFFFF"/>
      <rect x="1002" y="312" width="46" height="46" rx="8" fill="#E3F7EE"/>
